# 自动发布：推送 v* 标签时触发，交叉编译四大平台产物并创建 GitHub Release。
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# 产物：
#   hidir_<版本>_windows_amd64.zip
#   hidir_<版本>_linux_amd64.tar.gz
#   hidir_<版本>_darwin_amd64.tar.gz   (macOS Intel)
#   hidir_<版本>_darwin_arm64.tar.gz   (macOS Apple Silicon)
#   checksums.txt                      (SHA256 校验和)
#
# 版本号通过 -ldflags 注入 hidir/internal/settings.Version 与
# hidir/internal/options.Version，二进制 --version 与横幅即显示 tag 版本。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GOVERSION: "1.25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}
          cache: true

      - name: Extract version from tag
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X hidir/internal/settings.Version=${VERSION} -X hidir/internal/options.Version=${VERSION}" \
            -o "dist/hidir${{ matrix.ext }}" .
          echo "BIN=dist/hidir${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Smoke test (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" -h > /dev/null

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          STAGING="hidir_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir "$STAGING"
          cp "$BIN" "$STAGING/hidir${{ matrix.ext }}"
          cp README.md config.ini "$STAGING/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${STAGING}.zip" "$STAGING"
            sha256sum "${STAGING}.zip" > "${STAGING}.zip.sha256"
            echo "ARTIFACT=${STAGING}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${STAGING}.tar.gz" "$STAGING"
            sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
            echo "ARTIFACT=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # 仅 tag 触发时发布（workflow_dispatch 手动运行时只构建不发布）
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums file
        shell: bash
        run: |
          cd dist
          # 汇总各平台的 .sha256 为单一 checksums.txt（内容为原始 sha256sum 行）
          find . -maxdepth 1 -name "*.sha256" -exec cat {} \; | sed 's|\./||' > checksums.txt
          rm -f -- *.sha256
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: HiDir ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
